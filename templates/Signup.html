<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVitals | Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signup.css') }}">
</head>
<body>

    <div class="signup-container">
        <div class="header-section">
            <h2 class="brand-name">CloudVitals</h2>
            <h1 class="welcome-text">Join CloudVitals</h1>
            <p class="subtitle">Securely monitor your infrastructure in real-time</p>
        </div>

        <form action="{{ url_for('signup') }}" method="POST" class="signup-form">
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="e.g. user@example.com" required>
            </div>

            <div class="input-group">
                <label for="ssh_link">Server SSH Link</label>
                <input type="text" id="ssh_link" name="ssh_link" placeholder="user@192.168.1.1" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 8 characters" required>
            </div>

            <button type="submit" class="signup-btn">CREATE ACCOUNT</button>
        </form>

        <div class="footer-links">
            <p>Already have an account? <a href="{{ url_for('login_page') }}">Login here</a></p>
            <p class="back-home"><a href="{{ url_for('home') }}">← Back to Home</a></p>
        </div>
    </div>

</body>
</html>
